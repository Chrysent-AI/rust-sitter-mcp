[package]
name = "rust-sitter-mcp"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "Structural Rust search and refactoring proposals over MCP"

[dependencies]
ra_ap_hir = { version = "=0.0.357", default-features = false }
ra_ap_ide_db = { version = "=0.0.357", default-features = false }
ra_ap_base_db = { version = "=0.0.357", default-features = false }
ra_ap_syntax = { version = "=0.0.357", default-features = false }
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
tree-sitter = "=0.27.0"
tree-sitter-rust = "=0.24.2"
ignore = "0.4"
similar = { version = "3.2", default-features = false, features = ["text"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"] }
clap = { version = "4.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
