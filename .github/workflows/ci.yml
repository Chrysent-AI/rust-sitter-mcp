name: CI

# Linux only, by policy: macOS is validated by the maintainers' local gated
# workflow (macOS cloud builds are intentionally excluded for cost).
# amd64 via ubuntu-latest, arm64 via the free public-repo arm runners.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup component add rustfmt clippy

      - name: Install gate tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features --locked

      - name: Release build + version sanity
        run: |
          cargo build --release --locked
          ./target/release/rust-sitter-mcp --version

      - name: Advisories and licenses
        run: cargo deny check

      - name: Unused dependencies
        run: cargo machete

      - name: Tooling hook regressions (fixtures only)
        run: make test-tooling
