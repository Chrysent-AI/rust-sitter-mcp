[advisories]
ignore = []

[licenses]
# Only licenses actually present in the locked graph; cargo-deny warns on
# unmatched (dead) allowances. A future dependency that needs one is re-added
# here deliberately, with its dependency-log entry.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib"]

# Package-scoped exception (human-approved 2026-10-06): rustc_apfloat is the
# rust-analyzer transitive that carries the LLVM-exception rider; the exception
# is deliberately NOT a global allowance.
[[licenses.exceptions]]
crate = "rustc_apfloat"
allow = ["Apache-2.0 WITH LLVM-exception"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
